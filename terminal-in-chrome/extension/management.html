<!DOCTYPE html>
<html>
<head>
  <title>Terminal Management</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      background-color: #f6f8fa;
    }
    h1 {
      color: #24292f;
      border-bottom: 1px solid #d0d7de;
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .refresh-btn {
      background: #0969da;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 14px;
    }
    .refresh-btn:hover {
      background: #0550ae;
    }
    .card {
      background: white;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(27,31,36,0.04);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .url-title {
      font-weight: 600;
      font-size: 16px;
      color: #0969da;
      word-break: break-all;
    }
    .close-btn {
      background: #cf222e;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .close-btn:hover {
      background: #a40e26;
    }
    .stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #57606a;
      flex-wrap: wrap;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
    }
    .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      color: #57606a;
    }
    .stat-value {
      font-weight: 600;
      color: #24292f;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #57606a;
      background: white;
      border: 1px solid #d0d7de;
      border-radius: 6px;
    }
    .error-msg {
      color: #cf222e;
      padding: 10px;
      background: #FFEBE9;
      border-radius: 4px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>
    Terminal Management
    <button id="refreshBtn" class="refresh-btn">Refresh</button>
  </h1>
  
  <div id="errorMsg" class="error-msg"></div>
  
  <div id="terminalsList">
    <!-- Terminals will be injected here -->
    <div class="empty-state">Loading...</div>
  </div>

  <script src="management.js"></script>
</body>
</html>
